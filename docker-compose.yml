services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wordgame
      POSTGRES_PASSWORD: wordgame
      POSTGRES_DB: wordgame
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordgame"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://wordgame:wordgame@db:5432/wordgame
    ports:
      - "8000:8000"
    # The slim image has no curl, so check /health with Python.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
