name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs AWS or any other secret. Read-only access to the repo is enough.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wordgame
          POSTGRES_PASSWORD: wordgame
          POSTGRES_DB: wordgame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wordgame"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test (SQLite)
        run: pytest -q

      - name: Test (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://wordgame:wordgame@localhost:5432/wordgame_test
        run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate and test (mocked AWS, no credentials)
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Start the full stack (API + Postgres)
        run: docker compose up -d --build --wait

      - name: Smoke test
        run: python3 scripts/smoke_test.py http://localhost:8000

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
