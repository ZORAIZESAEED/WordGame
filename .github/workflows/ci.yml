name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t wordgame:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d --name wg -p 8000:8000 wordgame:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs wg
          exit 1
