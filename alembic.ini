# Used by the `alembic` command line, e.g. to create a new migration:
#   alembic revision --autogenerate --rev-id 0002 -m "add daily games"
# The app runs migrations itself on startup (app/migrate.py), so you rarely need
# `alembic upgrade` by hand. The database URL comes from DATABASE_URL, as for the app.

[alembic]
script_location = %(here)s/app/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
